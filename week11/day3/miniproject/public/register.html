<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    form { display: grid; gap: 12px; }
    label { display: flex; flex-direction: column; font-weight: bold; }
    input { padding: 8px; font-size: 1rem; }
    button { padding: 10px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Register</h1>
  <form id="registerForm">
    <label>Name<input type="text" id="name" name="name" required /></label>
    <label>Last Name<input type="text" id="lastName" name="lastName" required /></label>
    <label>Email<input type="email" id="email" name="email" required /></label>
    <label>Username<input type="text" id="username" name="username" required /></label>
    <label>Password<input type="password" id="password" name="password" required /></label>
    <button type="submit" id="submitButton" disabled>Register</button>
  </form>
  <div class="message" id="message"></div>
  <script>
    const form = document.getElementById('registerForm');
    const submitButton = document.getElementById('submitButton');
    const message = document.getElementById('message');
    const inputs = Array.from(form.querySelectorAll('input'));

    function updateButtonState() {
      const allFilled = inputs.every((input) => input.value.trim() !== '');
      submitButton.disabled = !allFilled;
    }

    inputs.forEach((input) => {
      input.addEventListener('input', updateButtonState);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      const payload = {
        name: document.getElementById('name').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('/api/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (response.ok) {
          message.style.color = 'green';
          message.textContent = result.message || 'Registered successfully.';
          form.reset();
          updateButtonState();
        } else {
          message.style.color = 'red';
          message.textContent = result.error || 'Registration failed.';
        }
      } catch (error) {
        message.style.color = 'red';
        message.textContent = 'Unable to register at this time.';
      }
    });
  </script>
</body>
</html>
